[pytest]
# Pytest Configuration
# ====================
# Run all tests: pytest
# Run with coverage: pytest --cov=src --cov=agents --cov-report=html
# Run only unit tests: pytest -m unit
# Run benchmarks: pytest --benchmark-autosave
# Run verbose: pytest -v
# Run sequential (no xdist): pytest -p no:xdist

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use external resources)
    slow: Slow running tests
    benchmark: Performance benchmark tests
    chaos: Chaos/security tests (VBus HMAC integrity, adversarial injection)
    owasp: OWASP API Security tests
    performance: Performance and memory tests
    contract: API contract regression tests
    negative: Negative/adversarial input tests
    silicon: Hardware-required tests (TDX / TPM / NPU / 48h soak). Skipped unless --silicon CLI flag is passed; opt-in via the Sprint 14.2 silicon CI runner (.github/workflows/silicon_battery.yml).

# Output & Parallelism (pytest-xdist)
# --dist loadfile: tests in the same file run on the same worker
# -n auto: one worker per CPU core (xdist auto-detects)
# --benchmark-disable: benchmarks are incompatible with xdist workers
addopts =
    -v
    --tb=short
    --strict-markers
    -n auto
    --dist loadfile
    --benchmark-disable

# Benchmark configuration (pytest-benchmark)
# Run with: pytest -p no:xdist --benchmark-autosave
# Compare: pytest -p no:xdist --benchmark-compare
# Note: benchmarks must run sequentially — use -p no:xdist
#
# P3.2 (2026-05-11) — the inline `benchmark_*` ini keys were removed
# because newer pytest emits `PytestConfigWarning: Unknown config
# option` for them under workers where pytest-benchmark hasn't
# registered them yet (it registers its options at session start, not
# at ini parse time). Pass the same defaults on the command line when
# running benchmarks:
#   pytest -p no:xdist --benchmark-autosave --benchmark-warmup=on \
#          --benchmark-disable-gc --benchmark-min-rounds=5

# Coverage settings (when using pytest-cov)
# Run with: pytest --cov=src --cov=agents
# Minimum coverage threshold (CI gate)
# --cov-fail-under=70

# Ignore warnings
# P3.2 (2026-05-11) — added two host-specific suppressions to keep the
# pytest summary at zero warnings:
#   * urllib3 NotOpenSSLWarning — macOS LibreSSL system openssl noise,
#     fires once per worker on import.
#   * jwt InsecureKeyLengthWarning — the airgap harness signs offline
#     tokens with a deliberately short HMAC key; tightening it would
#     not improve the security posture of a localhost test.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::urllib3.exceptions.NotOpenSSLWarning
    ignore::jwt.warnings.InsecureKeyLengthWarning

# Minimum version
minversion = 7.0

