# ============================================================================
# V OS MCP Agent Server - Kubernetes Manifests
# ============================================================================
# Deploy with: kubectl apply -f k8s/
# ============================================================================

---
# ============================================================================
# Namespace
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: namespace

---
# ============================================================================
# ConfigMap - Non-sensitive configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: v-os-mcp-config
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Security
  ALLOWED_HOSTS: "127.0.0.1,localhost,v-os-mcp-server,v-os-mcp-server.v-os.svc.cluster.local"
  
  # Cache
  CACHE_ENABLED: "true"
  CACHE_TTL: "300000"
  CACHE_MAX_SIZE: "1000"
  
  # Features
  FEATURE_STREAMING: "true"
  FEATURE_MULTI_AGENT: "true"
  FEATURE_CONTEXT: "true"
  
  # Observability
  OTEL_SERVICE_NAME: "v-os-mcp-agent-server"
  METRICS_ENABLED: "true"

---
# ============================================================================
# Secret - Sensitive configuration
# ============================================================================
# NOTE: In production, use External Secrets, Vault, or Sealed Secrets
apiVersion: v1
kind: Secret
metadata:
  name: v-os-mcp-secrets
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace with actual values or use external secrets management
  OPENAI_API_KEY: "sk-your-openai-key"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-key"
  V_OS_API_KEY: "your-api-key-for-auth"
  REDIS_URL: "redis://v-os-redis:6379"

---
# ============================================================================
# Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v-os-mcp-server
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "1.0.1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: v-os-mcp
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: v-os-mcp
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: v-os-mcp-sa
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      
      # Anti-affinity for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: v-os-mcp
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: mcp-server
          image: ghcr.io/v-os/mcp-agent-server:1.0.1
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: v-os-mcp-config
            - secretRef:
                name: v-os-mcp-secrets
          
          # Resource limits
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      
      volumes:
        - name: tmp
          emptyDir: {}
      
      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# ============================================================================
# Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: v-os-mcp-server
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: server

---
# ============================================================================
# Ingress (with TLS)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: v-os-mcp-ingress
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  tls:
    - hosts:
        - mcp.your-domain.com
      secretName: v-os-mcp-tls
  rules:
    - host: mcp.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: v-os-mcp-server
                port:
                  name: http

---
# ============================================================================
# ServiceAccount
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: v-os-mcp-sa
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: serviceaccount

---
# ============================================================================
# HorizontalPodAutoscaler
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: v-os-mcp-hpa
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: v-os-mcp-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
# ============================================================================
# PodDisruptionBudget
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: v-os-mcp-pdb
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: v-os-mcp
      app.kubernetes.io/component: server

---
# ============================================================================
# NetworkPolicy
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: v-os-mcp-network-policy
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: v-os-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow to external LLM APIs
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
# ============================================================================
# Redis Deployment (for distributed caching)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v-os-redis
  namespace: v-os
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: v-os-redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: v-os-redis
  namespace: v-os
  labels:
    app.kubernetes.io/name: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: redis

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: v-os-redis-pvc
  namespace: v-os
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
# ============================================================================
# ServiceMonitor (for Prometheus Operator)
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: v-os-mcp-monitor
  namespace: v-os
  labels:
    app.kubernetes.io/name: v-os-mcp
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: v-os-mcp
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
