# =============================================================================
# VOS-Cyber v21.7-UX — System Nginx Reverse Proxy
# =============================================================================
# Drops in at /etc/nginx/sites-available/vos-cyber, then symlink into
# /etc/nginx/sites-enabled/. Routes:
#
#     :80  /            -> 127.0.0.1:3000  (Next.js frontend)
#     :80  /api/*       -> 127.0.0.1:8000  (FastAPI backend, prefix preserved)
#
# This config is HTTP-only. For production traffic, terminate TLS (Let's
# Encrypt via certbot) and add the standard `listen 443 ssl http2;` block
# plus `add_header Strict-Transport-Security ...`. The HTTP-only form is
# acceptable for the v21.7 hybrid demo on a single VPS; do NOT deploy
# this verbatim for customer traffic.
# =============================================================================

# Limit request body size (matches FastAPI Pydantic Field(max_length=...) caps
# in codegen_routes.py / memory_routes.py — 100KB prompts, 50KB content).
client_max_body_size 5M;

# Server-tier rate limiting zone (per-IP, conservative).
limit_req_zone $binary_remote_addr zone=vos_cyber_per_ip:10m rate=20r/s;

upstream vos_cyber_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream vos_cyber_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Centralised log dir — aligns with docker-compose volume mounts and
    # bootstrap.sh's `mkdir -p /var/log/vos-cyber`.
    access_log /var/log/vos-cyber/nginx-access.log;
    error_log  /var/log/vos-cyber/nginx-error.log warn;

    # Sane security headers (HTTP-only set; harden when adding TLS).
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # Note: CSP not set here — the existing nginx.conf in the repo root
    # carries the v21.0 hardened CSP. Mirror that block here when you
    # promote this config to TLS.

    # Backend API — preserve the /api/ prefix because FastAPI routes are
    # registered with /api/<group> mounts (router_registry.py). Stripping
    # the prefix would 404 every endpoint.
    location /api/ {
        limit_req zone=vos_cyber_per_ip burst=40 nodelay;

        proxy_pass http://vos_cyber_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Streaming-friendly defaults for chat/SSE endpoints.
        proxy_buffering        off;
        proxy_cache            off;
        proxy_request_buffering off;
    }

    # Next.js static assets — long cache, no app server hop.
    location /_next/static/ {
        proxy_pass http://vos_cyber_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else — Next.js frontend.
    location / {
        proxy_pass http://vos_cyber_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
