# Sprint 15 / Item C8 — sample Sandbox manifest for a vOS agent
# Source: https://kubernetes.io/blog/2026/03/20/running-agents-on-kubernetes-with-agent-sandbox/
#
# Apply with:
#   kubectl apply -f vos-agent-sandbox.yaml -n vos-agents
#
# Fields mirror backend/sandbox/gvisor_config.json. Operators override
# per-deployment via spec.policyConfigMapRef.
apiVersion: apps.k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: vos-agent-default
  namespace: vos-agents
  labels:
    vos3.io/component: agent-runtime
    vos3.io/sprint: "15"
    vos3.io/profile: enterprise
spec:
  runtime: gvisor-magi
  isolationMode: per-agent
  policyConfigMapRef:
    name: vos-gvisor-policy
    key: gvisor_config.json
  networkPolicy:
    type: sandbox
    egressAllowlistEnv: VOS3_EGRESS_ALLOWLIST
  limits:
    memoryMB: 4096
    cpuQuotaPercent: 200
    wallClockSeconds: 1800
    openFiles: 64
    processes: 4
  attestation:
    rtmrIndex: 3
    complianceStoreEndpoint: /api/compliance/audit/sandbox-start
---
# ConfigMap holding the canonical policy file. In production the operator
# generates this from backend/sandbox/gvisor_config.json via:
#   kubectl create configmap vos-gvisor-policy \
#     --from-file=gvisor_config.json=backend/sandbox/gvisor_config.json \
#     -n vos-agents --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: vos-gvisor-policy
  namespace: vos-agents
  labels:
    vos3.io/component: agent-policy
data:
  gvisor_config.json: |
    {
      "_comment": "Replace with rendered backend/sandbox/gvisor_config.json at deploy time. This stub keeps the Sandbox admission webhook happy in dev.",
      "version": "1.0",
      "magi": {"enabled": true, "isolation_mode": "per-agent"},
      "platform": {"preferred": "systrap"},
      "network": {"type": "sandbox"}
    }
