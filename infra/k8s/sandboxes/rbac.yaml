# Sprint 15 / Item C8 — RBAC for vOS agent sandboxes
# Source: https://kubernetes.io/blog/2026/03/20/running-agents-on-kubernetes-with-agent-sandbox/
#
# Scoped to the vos-agents namespace. The ServiceAccount cannot read
# Secrets globally — read the Sprint 14.1 cert_vault doc before relaxing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vos-agent-sa
  namespace: vos-agents
  labels:
    vos3.io/component: agent-sa
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vos-agent-role
  namespace: vos-agents
rules:
  # Read the Sandbox object the agent is bound to (no write).
  - apiGroups: ["apps.k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # Read the policy ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vos-gvisor-policy"]
    verbs: ["get", "watch"]
  # Emit Events for the compliance store ingestion path.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vos-agent-rolebinding
  namespace: vos-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vos-agent-role
subjects:
  - kind: ServiceAccount
    name: vos-agent-sa
    namespace: vos-agents
