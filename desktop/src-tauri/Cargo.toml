[package]
name = "vos3-enclave"
version = "1.0.0"
description = "VOS3 Enclave — Sovereign AI Desktop"
authors = ["VOS3 Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2.5"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1"
# W6.4 — libc::kill() for SIGTERM during sidecar shutdown (Unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
