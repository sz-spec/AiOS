[package]
name = "vos3-enclave"
version = "1.0.0"
description = "VOS3 Enclave — Sovereign AI Desktop"
authors = ["VOS3 Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
sha2 = "0.11.0"
hmac = "0.13.0"
subtle = "2.6.1"
memmap2 = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4"] }
rand = "0.10.2"
thiserror = "2.0.20"
# W6.4 — libc::kill() for SIGTERM during sidecar shutdown (Unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
